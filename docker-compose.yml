services:
  maintainerr:
    image: 3.32.0
    container_name: maintainerr-swarm
    restart: unless-stopped
    user: "1000:1000"
    ports:
    - target: 6246
      published: 6246
      protocol: tcp
      mode: host
    deploy:
      placement:
        constraints:
        - node.labels.deployment.target.maintainerr == true
      restart_policy:
        condition: on-failure
    volumes:
    - maintainerr-swarm_data:/opt/data
    - /media/Multimedia/Movies:/movies
    - /media/Multimedia/TV Series:/tv
    environment:
    - TZ=America/Chicago
    healthcheck:
      test:
      - CMD
      - /opt/app/healthcheck.sh
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
volumes:
  maintainerr-swarm_data:
    name: maintainerr-swarm_data
